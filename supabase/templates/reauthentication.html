<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tu código de verificación de Wayio</title>
  </head>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Tu código de verificación de Wayio.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px -16px rgba(15,23,42,0.25);">
            <tr>
              <td style="background:linear-gradient(135deg,#14b8a6,#0a9488);padding:36px 40px;text-align:center;">
                <span style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">Wayio</span>
              </td>
            </tr>
            <tr>
              <td style="padding:40px 40px 8px;">
                <h1 style="margin:0 0 12px;font-size:22px;font-weight:800;color:#0f172a;">Verifica que eres tú 🛡️</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">
                  Usa este código para confirmar tu identidad. Caduca en unos minutos.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin:0 0 28px;">
                  <tr>
                    <td align="center" style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:14px;padding:24px;">
                      <span style="font-size:34px;font-weight:800;letter-spacing:10px;color:#0a9488;">{{ .Token }}</span>
                    </td>
                  </tr>
                </table>
                <div style="border-top:1px solid #e2e8f0;padding-top:20px;">
                  <p style="margin:0;font-size:13px;line-height:1.6;color:#94a3b8;">
                    Si no solicitaste este código, ignora este correo y cambia tu contraseña por seguridad.
                  </p>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 36px;text-align:center;">
                <p style="margin:0;font-size:12px;color:#94a3b8;">Wayio · Tu copiloto de viajes con IA</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
