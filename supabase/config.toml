# ============================================================================
# Wayio — Configuración del proyecto Supabase (CLI / local stack)
# ----------------------------------------------------------------------------
# Esto controla `supabase start` (stack local) y `supabase db push` (migraciones).
# Para el proyecto HOSTED (supabase.com), las plantillas de email y las URLs de
# redirección se configuran en el Dashboard — ver supabase/CONFIGURACION-AUTH.md.
# ============================================================================

project_id = "wayio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Servidor SMTP de prueba: captura los emails de auth en local (http://localhost:54324)
enabled = true
port = 54324

[auth]
enabled = true
# URL base de la web. En producción: https://wayio.app
site_url = "http://localhost:3000"
# Destinos permitidos tras login/confirmación (web + deep link de la app mobile).
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://wayio.app/auth/callback",
  "wayio://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Permite registro de cuentas nuevas (login/register).
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Exige confirmar el email antes de iniciar sesión (recomendado en producción).
enable_confirmations = true
# Permite restablecer contraseña y magic link.
secure_password_change = true

# --- Plantillas de email personalizadas (las de supabase/templates/) ---
[auth.email.template.confirmation]
subject = "Confirma tu cuenta en Wayio ✈️"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Tu enlace de acceso a Wayio 🔑"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de Wayio 🔒"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Te invitaron a Wayio 🌍"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo email en Wayio ✉️"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Tu código de verificación de Wayio 🛡️"
content_path = "./supabase/templates/reauthentication.html"

# --- Proveedores OAuth ---
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Redirección que registras en Google Cloud Console.
redirect_uri = "http://localhost:54321/auth/v1/callback"
